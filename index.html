<!doctype html><html lang="it"><head><meta name="theme-color" content="#2a56e0"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scheda Allenamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: app a una colonna per il telefono in palestra. Tab in alto, sessione a schede, recupero indicato su ogni esercizio. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface2:#e3e7ec; --fg:#12171c; --muted:#5b6672; --line:#d3d9e0;
  --accent:#2a56e0; --accent-fg:#ffffff; --good:#17794a; --good-bg:#dcf1e6; --warn:#9a5b00; --warn-bg:#fbeccc; --bad:#b3261e; --bad-bg:#f8dcda;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --fg:#e8edf2; --muted:#93a0ad; --line:#2d3641;
  --accent:#7f9cff; --accent-fg:#0b1020; --good:#58d196; --good-bg:#12301f; --warn:#f0b24a; --warn-bg:#35280d; --bad:#ff8d85; --bad-bg:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --fg:#e8edf2; --muted:#93a0ad; --line:#2d3641;
  --accent:#7f9cff; --accent-fg:#0b1020; --good:#58d196; --good-bg:#12301f; --warn:#f0b24a; --warn-bg:#35280d; --bad:#ff8d85; --bad-bg:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);padding-inline:16px;padding-block:0 120px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-block:4px 16px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
h2{font:700 22px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}
h3{font:700 20px/1.15 var(--display);letter-spacing:.01em;margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.day{display:flex;flex-direction:column;gap:10px}
.day .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.day .num{font:700 14px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:11px 16px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:7px 12px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sessionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.stat{font:600 15px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .25s}
.sec{font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.warm .wi{border-bottom:1px solid var(--line)}
.warm .wi:last-child{border-bottom:0}
.warm label{display:flex;gap:12px;align-items:center;padding:10px 0}
.whow{margin:-4px 0 10px 34px;font-size:14px}
.whow summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.whow p{margin:6px 0 0;color:var(--fg)}
.warm input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.warm .rx{margin-left:auto;color:var(--muted);font-size:14px;text-align:right}
.warm label.done span:first-of-type{text-decoration:line-through;color:var(--muted)}
.block{display:flex;flex-direction:column;gap:10px}
.block.ss{border-left:3px solid var(--accent);padding-left:10px}
.sslabel{font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ab{display:inline-block;min-width:22px;text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:6px;font:700 13px var(--display);padding:1px 6px;margin-right:6px}
.scheme{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cue{font-size:14px;color:var(--muted);margin:4px 0 0}
.figs{display:flex;gap:8px;margin-top:10px}
.fig{flex:1;min-width:0;max-width:220px;background:var(--bg);border-radius:10px;padding:4px;position:relative}
.fig span{position:absolute;left:8px;top:6px;font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fig svg{width:100%;height:auto;max-height:150px;display:block}
.fig .near,.fig .far,.fig .eq{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .near{stroke:var(--fg);stroke-width:3.2}
.fig .far{stroke:var(--muted);stroke-width:3}
.fig .eq{stroke:var(--accent);stroke-width:2.6;opacity:.75}
.fig .eq.thin{stroke-width:.9;opacity:.6}
.fig .head{fill:none;stroke:var(--fg);stroke-width:2.6}
.fig .wt{fill:var(--accent)}
.fig .gr{stroke:var(--line);stroke-width:1.2}
.photos{display:flex;gap:8px;margin-top:10px}
.photos img{flex:1;min-width:0;max-width:100%;height:auto;border-radius:10px;display:block}
.vid{display:inline-block;margin-top:8px;font-size:13px;color:var(--accent)}
.last{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.last .hist{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;align-self:flex-start;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.pill.up{background:var(--good-bg);color:var(--good)}
.pill.hold{background:var(--surface2);color:var(--fg)}
.pill.down{background:var(--warn-bg);color:var(--warn)}
.pill.first{background:var(--surface2);color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center}
.set.nokg{grid-template-columns:34px 1fr 48px}
.set .n{font:700 16px var(--display);color:var(--muted);text-align:center}
.fld{position:relative}
.fld input{width:100%;min-width:0;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 38px 0 12px;font:600 18px var(--body);font-variant-numeric:tabular-nums}
.fld em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.chk{height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center}
.chk svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.set.done .chk{background:var(--good);border-color:var(--good)}
.set.done .chk svg{stroke:var(--surface)}
.set.done input{color:var(--muted)}
.addset{margin-top:8px}
details.prog{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.prog summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
details.prog summary::-webkit-details-marker{display:none}
details.prog summary::before{content:"+ "}
details.prog[open] summary::before{content:"− "}
.pg{margin-top:8px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.pg p{margin:0}
.pg ol,.pg ul{margin:4px 0 0;padding-left:20px}
.pg li{margin:3px 0}
.pg .t{font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.pg .warn{background:var(--warn-bg);color:var(--fg);border-radius:8px;padding:8px 10px}
.pg .warn .t{color:var(--warn)}
.finish{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.gen{font-size:14px}
.gen ul{margin:6px 0 0;padding-left:18px}
.gen li{margin-bottom:4px}
.hs{display:flex;flex-direction:column;gap:12px}
.hs .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hs ul{list-style:none;margin:8px 0 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.hs li{display:flex;justify-content:space-between;gap:10px}
.hs li span:last-child{color:var(--muted);text-align:right}
.prow{display:grid;grid-template-columns:1fr 96px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:64px}
.prow svg{width:96px;height:28px;display:block}
.prow .nm{min-width:0;overflow-wrap:anywhere}
/* Report */
.reminder{border-color:var(--accent)}
.rtag{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rnav h2{margin:0;text-align:center;font-size:20px}
.rnav .btn{min-width:44px;font-size:18px;line-height:1}
.rnav .btn:disabled{opacity:.35}
.rnote{margin:0 0 8px;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--surface2);border-radius:10px;padding:10px 6px;text-align:center}
.kpi b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.card .kpi+.wbars{margin-top:14px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rlist li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.rlist li:last-child{border-bottom:0;padding-bottom:0}
.rlist .nm{min-width:0}
.rlist .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rlist.block li{flex-direction:column;gap:2px}
.tr{display:inline-block;width:1.1em;text-align:center;color:var(--muted)}
.tr.up{color:var(--good)}
.tr.down{color:var(--warn)}
.gbar{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;font-size:14px;margin:7px 0}
.gbar .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.gbar b{text-align:right;font-variant-numeric:tabular-nums}
.wbars{display:flex;gap:8px;align-items:flex-end}
.wbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wbars b{color:var(--fg);font-variant-numeric:tabular-nums}
.wbars i{display:block;width:100%;max-width:44px;border-radius:6px 6px 0 0;background:var(--accent)}
.wbars .ok i{background:var(--good)}
.peso{display:flex;gap:8px;align-items:center}
.peso .fld{flex:1}
.att{background:var(--warn-bg);border-radius:10px;padding:8px 10px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <div class="top"><h1>Scheda Allenamento</h1></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="oggi" aria-selected="true">Allenamento</button>
    <button role="tab" data-tab="storico" aria-selected="false">Storico</button>
    <button role="tab" data-tab="report" aria-selected="false">Report</button>
    <button role="tab" data-tab="guida" aria-selected="false">Guida</button>
  </div>
  <main id="view"></main>
</div>

<script>
/* ---------- Dati della scheda ---------- */
const GROUPS = {
  comp:{name:'Multiarticolare', rule:'Progressione di carico. Lavora con 1-2 ripetizioni di riserva. Quando completi tutte le serie al limite alto del range, aumenta il carico e riparti dal limite basso.'},
  uni:{name:'Unilaterale', rule:'Stesso carico e stesse ripetizioni per i due lati, regolando sul lato debole (parti sempre da quello). Aumenta quando il lato debole completa il limite alto del range.'},
  iso:{name:'Isolamento', rule:'Prima aumenta le ripetizioni fino al limite alto, poi il carico. Esecuzione controllata, senza slancio.'},
  core:{name:'Core e postura', rule:'Progredisci con più tempo sotto tensione, pause di 2-3" o più carico, non con ripetizioni veloci.'},
  cardio:{name:'Cardio', rule:'Aumenta la durata di 2-3 minuti ogni una o due settimane, oppure aggiungi un po\' di inclinazione.'}
};
const GENERIC_WARN = 'Aumenta il carico solo se hai completato tutte le serie con tecnica pulita. Se una serie salta, mantieni lo stesso carico alla seduta successiva.';

// k: load (kg x rip) | inv (assistenza: meno kg = meglio) | time (secondi) | bw (corpo libero, kg opzionale) | min (minuti)
const EX = {
  bench:{name:'Panca piana manubri', g:'comp', k:'load', inc:2, cue:'Scapole addotte e depresse, piedi a terra, bacino appoggiato. Kg = peso di un manubrio.',
    prog:'Quando fai tutte le serie al limite alto, aumenta di 1-2 kg per manubrio e riparti dal limite basso.',
    warn:'Se il bacino si stacca dalla panca o un braccio sale più veloce dell\'altro, non aumentare. Cambia variante (piana, inclinata, presa neutra) ogni 4-6 settimane e riparti con carichi più leggeri.'},
  pullup:{name:'Pull-up assistito macchina', g:'comp', k:'inv', inc:5, cue:'Kg = assistenza della macchina. Spalle lontane dalle orecchie, petto verso la barra.',
    prog:'Qui progredisci togliendo assistenza: quando completi tutte le serie al limite alto, riduci di 5 kg e riparti dal limite basso.',
    warn:'Niente slancio. Se perdi il controllo delle scapole, rimetti assistenza.'},
  pulley:{name:'Pulley machine', g:'comp', k:'load', inc:2.5, cue:'Tira i gomiti verso i fianchi, petto aperto, tronco fermo.',
    prog:'Tutte le serie al limite alto: +2,5 kg e riparti dal limite basso.',
    warn:'Se il busto dondola per completare la ripetizione, il carico è troppo alto.'},
  facepull:{name:'Face pull', g:'iso', k:'load', inc:2.5, cue:'Corda all\'altezza del viso, gomiti alti, porta le mani ai lati delle orecchie.',
    prog:'Prima punta a 15 ripetizioni su tutte le serie, poi aumenta di un blocco di carico.',
    warn:'Carico leggero e controllato: è un esercizio di postura, non di forza. Niente slancio con la schiena.'},
  ohext:{name:'Estensioni overhead al cavo', g:'iso', k:'load', inc:2.5, cue:'Gomiti vicini alla testa e fermi, estendi senza inarcare la zona lombare.',
    prog:'Arriva a 15 ripetizioni su tutte le serie, poi aumenta il carico di un blocco.',
    warn:'Se inarchi la schiena per spingere, scendi di peso e contrai gli addominali.'},
  curl:{name:'Curl bilanciere', g:'iso', k:'load', inc:2, cue:'Gomiti fermi ai fianchi, niente spinta con le anche.',
    prog:'Arriva a 12 ripetizioni su tutte le serie, poi aggiungi 1-2 kg totali.',
    warn:'Se oscilli col busto, il carico è troppo alto. Tieni il bacino neutro.'},
  curlC:{name:'Curl al cavo', g:'iso', k:'load', inc:2.5, cue:'Gomiti fermi ai fianchi, polsi neutri, niente spinta con le anche.',
    prog:'Arriva a 12 ripetizioni su tutte le serie, poi aumenta di un blocco.',
    warn:'Se oscilli col busto, il carico è troppo alto. Tieni il bacino neutro.'},
  pallof:{name:'Pallof press', g:'core', k:'load', inc:2.5, cue:'Resisti alla rotazione: bacino e spalle fermi, espira mentre spingi. Parti dal lato debole.',
    prog:'Prima aggiungi una pausa di 2-3" in estensione. Poi aumenta il carico di un blocco.',
    warn:'Se il bacino ruota, riduci il carico. Quest\'esercizio serve al bacino, quindi la qualità conta più del peso.'},
  hipthrust:{name:'Hip thrust machine', g:'comp', k:'load', inc:5, cue:'Mento leggermente chiuso, costole giù, contrai i glutei in alto per 1" senza inarcare la schiena.',
    prog:'Tutte le serie a 8 ripetizioni: +5 kg e riparti da 6.',
    warn:'Se senti la zona lombare lavorare più dei glutei, riduci il carico e rallenta. Controlla che le due anche salgano insieme.'},
  rdl:{name:'RDL con manubri', g:'comp', k:'load', inc:2, cue:'Anche indietro, ginocchia morbide, schiena neutra, manubri vicini alle gambe. Kg = peso di un manubrio.',
    prog:'Tutte le serie al limite alto: +2 kg per manubrio e riparti dal limite basso.',
    warn:'Fermati appena la schiena perde la posizione neutra. Non cercare più ampiezza di quella che controlli.'},
  bulgarian:{name:'Bulgarian split squat', g:'uni', k:'load', inc:2, cue:'Busto leggermente inclinato, peso sul piede avanti. Kg = manubrio per mano. Parti dal lato debole.',
    prog:'Quando il lato debole completa 12 ripetizioni su tutte le serie, aumenta di 2 kg e riparti da 8.',
    warn:'Il ginocchio resta allineato al piede. Se il bacino ruota o cade da un lato, riduci il carico.'},
  latpd:{name:'Lat pulldown machine', g:'comp', k:'load', inc:2.5, cue:'Petto verso la barra, gomiti verso i fianchi, senza dondolare.',
    prog:'Tutte le serie a 12 ripetizioni: +2,5 kg e riparti da 8.',
    warn:'Evita di tirare con le braccia e di inclinarti indietro per completare le ripetizioni.'},
  incpress:{name:'Panca inclinata manubri', g:'comp', k:'load', inc:2, cue:'Panca a 30°, scapole addotte. Kg = peso di un manubrio.',
    prog:'Tutte le serie a 12 ripetizioni: +1-2 kg per manubrio e riparti da 10.',
    warn:'Cambia variante (piana, inclinata, presa neutra) ogni 4-6 settimane e riparti con carichi più leggeri.'},
  oarow:{name:'Rematore a un braccio', g:'uni', k:'load', inc:2, cue:'Mano e ginocchio dello stesso lato sulla panca, schiena piatta. Parti dal lato debole.',
    prog:'Quando il lato debole fa 12 ripetizioni su tutte le serie, aumenta di 2 kg e riparti da 10.',
    warn:'Tronco fermo e bacino squadrato: non ruotare per tirare più peso.'},
  latraiseC:{name:'Alzate laterali al cavo', g:'iso', k:'load', inc:1, cue:'Gomito leggermente flesso, sali fino all\'altezza della spalla, controlla la discesa.',
    prog:'Arriva a 15 ripetizioni su tutte le serie, poi aumenta di un blocco.',
    warn:'Se alzi la spalla verso l\'orecchio, il carico è troppo alto.'},
  sideplank:{name:'Plank laterale', g:'core', k:'time', inc:5, cue:'Corpo in linea da testa a piedi, bacino alto. Parti dal lato debole. Valore = secondi.',
    prog:'Aggiungi 5" a settimana. Oltre 45", passa a una variante più difficile o aggiungi carico.',
    warn:'Se il bacino cade, termina la serie. Stesso tempo sui due lati.'},
  frontsquat:{name:'Front squat', g:'comp', k:'load', inc:2.5, cue:'Gomiti alti, busto eretto, ginocchia in linea con i piedi. Kg = carico totale.',
    prog:'Tutte le serie a 8 ripetizioni: +2,5 kg e riparti da 6.',
    warn:'Se la schiena si arrotonda o i gomiti cadono, stop e riduci il carico. Niente cedimento sulle ultime ripetizioni.'},
  slrdl:{name:'RDL monopodalico con manubrio', g:'uni', k:'load', inc:2, cue:'Anche squadrate, gamba libera dritta all\'indietro, schiena neutra. Parti dal lato debole.',
    prog:'Quando il lato debole completa 10 ripetizioni su tutte le serie, aumenta di 2 kg e riparti da 8.',
    warn:'Se il bacino ruota o perdi equilibrio, riduci il carico o appoggia una mano. Qui il controllo viene prima del peso.'},
  legcurl:{name:'Leg curl machine', g:'iso', k:'load', inc:2.5, cue:'Anche aderenti all\'appoggio, discesa lenta in 2-3".',
    prog:'Arriva a 15 ripetizioni su tutte le serie, poi +2,5 kg e riparti da 10.',
    warn:'Se le anche si sollevano, il carico è troppo alto.'},
  shpress:{name:'Shoulder press manubri', g:'comp', k:'load', inc:2, cue:'Costole giù, glutei contratti, non inarcare la schiena. Kg = peso di un manubrio.',

/* ---------- Logica di progressione ---------- */
const r05=x=>Math.round(x*2)/2;
const fmtKg=x=>String(r05(x)).replace('.',',');
// Scarico di circa l'8% partendo dal carico usato, a passi pari all'incremento dell'esercizio
// (es. manubri di 2 in 2 kg): così il peso proposto esiste davvero.
const scendi=(kg,inc)=>Math.max(0,r05(kg-inc*Math.max(1,Math.round(kg*0.08/inc))));
// Range di scarico (circa -5/-10%) che contiene sempre il valore precompilato: scegli il peso che hai disponibile.
function rangeScarico(kg,inc){
  const nk=scendi(kg,inc), a=Math.max(0,Math.min(r05(kg*0.9),nk)), b=Math.max(nk,Math.min(r05(kg*0.95),kg-0.5));
  return a===b?fmtKg(a)+' kg':'tra '+fmtKg(a)+' e '+fmtKg(b)+' kg';
}
// Aumento consigliato (linee guida NSCA): circa +2,5/5% per la parte alta del corpo, +5/10% per gambe e glutei.
// Il valore precompilato è il carico usato + l'incremento dell'esercizio, sempre dentro il range.
const LOWER=new Set(['hipthrust','rdl','bulgarian','frontsquat','slrdl','legcurl']);
function rangeAumento(id,kg,inc){
  const [p1,p2]=LOWER.has(id)?[0.05,0.10]:[0.025,0.05], nk=kg+inc;
  const a=Math.min(nk,Math.max(kg+0.5,r05(kg*(1+p1)))), b=Math.max(nk,r05(kg*(1+p2)));
  return a===b?fmtKg(a)+' kg':'tra '+fmtKg(a)+' e '+fmtKg(b)+' kg';
}
// Esito di una seduta valutato sul suo schema: tutte le serie al limite alto, almeno una sotto il minimo, carico (se uguale su tutte le serie).
function esito(L,n,lo,hi){
  const [pn,plo,phi]=L.sc||[n,lo,hi], sets=L.sets, kgs=sets.map(s=>s.kg||0);
  return {full:sets.length>=pn&&sets.every(s=>s.reps>=phi), low:sets.some(s=>s.reps<plo),
    kg:kgs.every(k=>k===kgs[0])?kgs[0]:null, reps:sets.reduce((t,s)=>t+s.reps,0)};
}
// Ultime k sedute con lo stesso range di ripetizioni, dalla più recente.
function histFor(id,inst,k){
  const out=[];
  for(const s of S.sessions){
    if(!s.ex||!s.ex[id])continue;
    const sc=schemeOf(s,id);
    if(sc&&sc[1]===inst[2]&&sc[2]===inst[3])out.push({date:s.date,sets:s.ex[id],sc});
    if(out.length>=k)break;
  }
  return out;
}
// Schema [serie, rip min, rip max] con cui l'esercizio è stato fatto in una seduta: salvato, oppure ricavato dal giorno.
function schemeOf(s,id){
  if(s.sc&&s.sc[id])return s.sc[id];
  const d=DAY[s.day], e=d&&dayEntries(d).find(x=>x.it[0]===id);
  return e?e.it.slice(1,4):null;
}
// Ultima seduta con lo stesso range di ripetizioni (es. panca 6-8 e 8-10 hanno carichi separati); altrimenti l'ultima in assoluto.
function lastFor(id,inst){
  let any=null;
  for(const s of S.sessions){
    if(!s.ex||!s.ex[id])continue;
    const sc=schemeOf(s,id), L={date:s.date,sets:s.ex[id],sc};
    if(!inst||(sc&&sc[1]===inst[2]&&sc[2]===inst[3]))return L;
    if(!any)any=L;
  }
  return any;
}
function fmtSet(k,s){
  if(k==='time')return s.reps+'"';
  if(k==='min')return s.reps+' min';
  if(k==='bw'&&!s.kg)return String(s.reps);
  return fmtKg(s.kg)+'×'+s.reps;
}
function suggest(id,inst){
  const e=EX[id], [ ,n,lo,hi]=inst, L=lastFor(id,inst);
  if(!L)return {t:'first',msg:'Prima volta: scegli un carico che lasci 1-2 ripetizioni di riserva.',kg:''};
  // Obiettivo raggiunto o mancato si valuta sullo schema di quella seduta, non su quello di oggi.
  const [pn,plo,phi]=L.sc||[n,lo,hi];
  const sets=L.sets, full=sets.length>=pn&&sets.every(s=>s.reps>=phi), low=sets.some(s=>s.reps<plo);
  const top=Math.max(...sets.map(s=>s.kg||0));
  if(e.k==='time'){const m=Math.max(...sets.map(s=>s.reps));return full?{t:'up',msg:'Obiettivo raggiunto: prova '+(m+e.inc)+'" per serie.',kg:''}:{t:'hold',msg:'Punta a '+hi+'" su tutte le serie prima di allungare.',kg:''}}
  if(e.k==='min'){const m=Math.max(...sets.map(s=>s.reps));return full?{t:'up',msg:'Obiettivo raggiunto: prova '+(m+e.inc)+' min o aggiungi inclinazione.',kg:''}:{t:'hold',msg:'Completa '+lo+'-'+hi+' min prima di aumentare.',kg:''}}
  if(e.k==='bw'&&!top)return full?{t:'up',msg:'Aggiungi carico leggero o rallenta l\'esecuzione.',kg:''}:{t:'hold',msg:'Punta a '+hi+' ripetizioni su tutte le serie.',kg:''};
  // Pesi diversi tra le serie (stanchezza o prova di un carico nuovo): niente aumento.
  // Riferimento = carico usato nella maggior parte delle serie; a parità, quello più prudente.
  const kgs=sets.map(s=>s.kg||0);
  if(kgs.some(k=>k!==kgs[0])){
    const inv=e.k==='inv', cnt={};
    kgs.forEach(k=>cnt[k]=(cnt[k]||0)+1);
    const ref=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||(inv?b-a:a-b))[0];
    const lst=kgs.map(fmtKg).join(' / ')+' kg';
    if(sets.some(s=>(s.kg||0)===ref&&s.reps<plo)){
      if(inv)return {t:'down',msg:'Pesi diversi la volta scorsa ('+lst+') e '+fmtKg(ref)+' kg troppo difficile: porta l\'assistenza a '+fmtKg(ref+e.inc)+' kg.',kg:ref+e.inc};
      const nk=scendi(ref,e.inc);
      return {t:'down',msg:'Pesi diversi la volta scorsa ('+lst+') e '+fmtKg(ref)+' kg troppo alto: scendi a un peso '+rangeScarico(ref,e.inc)+', quello che hai disponibile.',kg:nk};
    }
    const hv=Math.max(...kgs);
    const prova=!inv&&hv>ref?' Hai provato '+fmtKg(hv)+' kg: se ti senti pronto, usalo su tutte le serie.':'';
    return {t:'hold',msg:'Pesi diversi la volta scorsa ('+lst+'): resta a '+fmtKg(ref)+' kg'+(inv?' di assistenza':'')+' su tutte le serie. Sali quando le completi tutte a '+hi+' rip con lo stesso peso.'+prova,kg:ref};
  }
  // Regole generali: sotto il minimo una volta sola = riprova con lo stesso carico (giornata storta o primo giorno dopo un aumento);
  // due sedute di fila sotto il minimo con lo stesso carico = scendi. Fermo da 3 sedute senza migliorare le ripetizioni = stallo.
  const H=histFor(id,inst,3), E=H.map(x=>esito(x,n,lo,hi)), same=x=>x&&x.kg===top;
  const twice=low&&H[0]&&H[0].date===L.date&&same(E[1])&&E[1].low;
  const stallo=!full&&!low&&E.length===3&&E.every(x=>same(x)&&!x.full&&!x.low)&&E[0].reps<=E[2].reps;
  if(e.k==='inv'){
    if(full){const nk=Math.max(0,top-e.inc);return {t:'up',msg:'Riduci l\'assistenza a '+fmtKg(nk)+' kg.',kg:nk}}
    if(twice||stallo)return {t:'down',msg:(stallo?'Fermo da 3 sedute':'Sotto il minimo per due volte di fila')+': porta l\'assistenza a '+fmtKg(top+e.inc)+' kg.',kg:top+e.inc};
    if(low)return {t:'hold',msg:'Sotto il minimo questa volta: riprova con '+fmtKg(top)+' kg di assistenza. Se succede di nuovo, aumenta l\'assistenza.',kg:top};
    return {t:'hold',msg:'Resta a '+fmtKg(top)+' kg di assistenza e punta a '+hi+' rip su tutte le serie.',kg:top}
  }
  if(full)return {t:'up',msg:'Sali a un peso '+rangeAumento(id,top,e.inc)+', quello che hai disponibile, e riparti da '+lo+' rip.',kg:top+e.inc};
  if(twice)return {t:'down',msg:'Sotto il minimo per due volte di fila: scendi a un peso '+rangeScarico(top,e.inc)+', quello che hai disponibile.',kg:scendi(top,e.inc)};
  if(stallo)return {t:'down',msg:'Fermo a '+fmtKg(top)+' kg da 3 sedute senza migliorare: scendi a un peso '+rangeScarico(top,e.inc)+' e risali, oppure cambia variante. Controlla anche sonno e recupero.',kg:scendi(top,e.inc)};
  if(low)return {t:'hold',msg:'Sotto il minimo questa volta: riprova con '+fmtKg(top)+' kg. Se succede di nuovo, l\'app ti farà scendere.',kg:top};
  return {t:'hold',msg:'Resta a '+fmtKg(top)+' kg e punta a '+hi+' rip su tutte le serie.',kg:top};
}

function startDay(id){
  const day=DAY[id], sets={};

    const sg=suggest(it[0],it), n=it[1];
    sets[it[0]]=Array.from({length:n},()=>({kg:sg.kg===''?'':sg.kg,reps:'',done:false}));
  });
  S.current={day:id,date:new Date().toISOString(),t0:Date.now(),warm:{},sets};
  touch();render();askWake();
}
function finish(){
  const c=S.current; if(!c)return;
  const ex={}, sc={};
  Object.keys(c.sets).forEach(id=>{
    const d=c.sets[id].filter(s=>s.done&&+s.reps>0).map(s=>({kg:+String(s.kg).replace(',','.')||0,reps:+s.reps}));
    if(d.length){ex[id]=d;const s0=schemeOf({day:c.day},id);if(s0)sc[id]=s0}
  });
  if(Object.keys(ex).length)S.sessions.unshift({id:'s'+c.t0,date:c.date,day:c.day,mins:Math.round((Date.now()-c.t0)/60000),ex,sc});
  S.current=null; touch(); tab='storico'; syncTabs(); render();
}

// Omino stilizzato. Angoli in gradi, 0 = verso il basso, 90 = verso destra, 180 = verso l'alto.
// t = inclinazione del busto dalla verticale, th/sn = coscia e stinco, ua/fa = braccio e avambraccio, "2" = arto lontano.
const RAD=Math.PI/180, f1=n=>n.toFixed(1);
const seg=(p,a,l)=>[p[0]+l*Math.sin(a*RAD),p[1]+l*Math.cos(a*RAD)];
const ln=(pts,cls)=>`<polyline class="${cls}" points="${pts.map(q=>f1(q[0])+','+f1(q[1])).join(' ')}"/>`;
function sideSvg(p,fg){
  const tv=[22*Math.sin(p.t*RAD),-22*Math.cos(p.t*RAD)];
  let hip,sh; if(p.s){sh=p.s;hip=[sh[0]-tv[0],sh[1]-tv[1]]}else{hip=p.h;sh=[hip[0]+tv[0],hip[1]+tv[1]]}
  const hd=[sh[0]+tv[0]*.36,sh[1]+tv[1]*.36];
  let o='',hands=[];
  if(p.th2!==undefined){const k=seg(hip,p.th2,16);o+=ln([hip,k,seg(k,p.sn2,16)],'far')}
  if(p.ua2!==undefined){const e=seg(sh,p.ua2,12),h=seg(e,p.fa2,12);o+=ln([sh,e,h],'far')}
  if(p.th!==undefined){const k=seg(hip,p.th,16);o+=ln([hip,k,seg(k,p.sn,16)],'near')}
  o+=ln([hip,sh],'near');
  if(p.ua!==undefined){const e=seg(sh,p.ua,12),h=seg(e,p.fa,12);o+=ln([sh,e,h],'near');hands.push(h)}
  o+=`<circle class="head" cx="${f1(hd[0])}" cy="${f1(hd[1])}" r="5"/>`;
  if(p.w)hands.forEach(h=>{o+=`<circle class="wt" cx="${f1(h[0])}" cy="${f1(h[1])}" r="3"/>`;if(fg.cb)o+=ln([h,[fg.cb[0],fg.cb[1]===null?h[1]:fg.cb[1]]],'eq thin')});
  return o;
}
function frontSvg(p){
  const bend=p.bend, sy=bend?38:24, hy=bend?48:46;
  let o=ln([[46,hy],[45,78]],'near')+ln([[54,hy],[55,78]],'near')+ln([[50,sy],[50,hy]],'near');
  o+=`<circle class="head" cx="50" cy="${bend?29:13}" r="5"/>`;
  [-1,1].forEach(d=>{
    const s=[50+d*8,sy],e=[s[0]+d*12*Math.sin(p.ua*RAD),s[1]+12*Math.cos(p.ua*RAD)],h=[e[0]+d*12*Math.sin(p.fa*RAD),e[1]+12*Math.cos(p.fa*RAD)];
    o+=ln([[50,sy],s,e,h],'near')+(p.w?`<circle class="wt" cx="${f1(h[0])}" cy="${f1(h[1])}" r="3"/>`:'');
  });
  return o;
}

  return `<svg viewBox="0 0 96 28" role="img" aria-label="andamento"><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}

/* ---------- Sincronizzazione su GitHub ----------
   Lo storico (stesso formato del backup) viene salvato in storico.json di un repository privato.
   Repository e token restano solo su questo dispositivo e non finiscono nel backup. */
const GH_KEY='gymmare-sync', GH_FILE='storico.json';
function ghCfg(){try{return JSON.parse(localStorage.getItem(GH_KEY)||'null')||{}}catch(e){return {}}}
function ghSet(c){try{localStorage.setItem(GH_KEY,JSON.stringify(c))}catch(e){}}
function hashStr(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)+':'+t.length}
let syncT=null, syncing=false;
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(()=>syncGh(false),3000)}
function syncMsg(t){const m=$('#syncmsg');if(m)m.textContent=t}
function syncStato(){const c=ghCfg();if(!c.repo||!c.token)return 'Non configurata.';
  return c.err?'Ultimo tentativo non riuscito: '+c.err:c.last?'Ultima sincronizzazione: '+new Date(c.last).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'Configurata, mai sincronizzata.'}
async function syncGh(manual){
  const c=ghCfg();if(!c.repo||!c.token||syncing||!navigator.onLine&&!manual)return;
  const data=bkData(),h=hashStr(data);
  if(!manual&&c.hash===h)return;
  syncing=true;if(manual)syncMsg('Sincronizzazione in corso...');
  const url='https://api.github.com/repos/'+c.repo+'/contents/'+GH_FILE,
    hd={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};
  try{
    for(let tent=0;tent<2;tent++){
      let sha;const g=await fetch(url,{headers:hd,cache:'no-store'});
      if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status===401?'token non valido o scaduto':g.status===403?'il token non ha accesso in scrittura al repository':'errore GitHub '+g.status);
      const r=await fetch(url,{method:'PUT',headers:hd,body:JSON.stringify({message:'Storico aggiornato '+new Date().toISOString().slice(0,16).replace('T',' '),content:btoa(unescape(encodeURIComponent(data))),sha})});
      if(r.ok){Object.assign(c,{hash:h,last:Date.now(),err:''});ghSet(c);if(manual)syncMsg('Fatto. '+syncStato());return}
      if(r.status!==409&&r.status!==422)throw new Error(r.status===404?'repository non trovato: controlla il nome e i permessi del token':'errore GitHub '+r.status);
    }
    throw new Error('conflitto sul file, riprova');
  }catch(e){c.err=e.message||'rete non disponibile';ghSet(c);if(manual)syncMsg('Non riuscita: '+c.err)}
  finally{syncing=false}
}
function syncHtml(){const c=ghCfg();return `<div class="card gen"><h2>Sincronizzazione</h2><p class="muted" style="margin:0 0 10px">Salva automaticamente lo storico in un repository GitHub privato a fine seduta, così può essere copiato su Notion. Repository e token restano solo su questo dispositivo.</p>
  <input id="ghrepo" placeholder="utente/repository" value="${c.repo||''}" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:8px 10px;font:inherit;font-size:14px;margin-bottom:8px">
  <input id="ghtoken" type="password" placeholder="${c.token?'Token salvato (lascia vuoto per non cambiarlo)':'Token GitHub (github_pat_...)'}" autocomplete="off" style="width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:8px 10px;font:inherit;font-size:14px">
  <div class="btnrow" style="margin-top:8px"><button class="btn small primary" data-act="ghsave">Salva e sincronizza</button>${c.token?'<button class="btn small" data-act="ghnow">Sincronizza ora</button><button class="btn small" data-act="ghoff">Disattiva</button>':''}</div>
  <div id="syncmsg" class="muted" style="font-size:14px;margin-top:6px" aria-live="polite">${syncStato()}</div></div>`}
function doImport(txt){
  let d;try{d=JSON.parse(String(txt).trim())}catch(e){bkMsg('Testo non valido: assicurati di aver copiato tutto il backup.');return}
  if(!d||!Array.isArray(d.sessions)){bkMsg('Backup non riconosciuto.');return}

  d.sessions.forEach(s=>{if(s&&s.id&&s.date&&s.ex&&!have.has(s.id)){S.sessions.push(s);have.add(s.id);n++}});
  S.sessions.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  if(d.plan&&!S.plan)S.plan=d.plan;
  // Pesate: una per settimana; se la settimana ne ha già una, si tiene quella presente.

  pesi().sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0);
  touch();render();bkMsg((n?(n===1?'Importata 1 seduta.':'Importate '+n+' sedute.'):'Nessuna seduta nuova: erano già tutte presenti.')+(np?` Importate ${np} pesate.`:''));
}

// ripetizioni o secondi per il corpo libero; per il pull-up assistito l'assistenza minima (più bassa = meglio).
function punteggio(id,sets){
  const k=EX[id].k, conKg=sets.filter(s=>s.kg>0);
  if(k==='inv')return Math.min(...sets.map(s=>s.kg));
  if(conKg.length&&k!=='time'&&k!=='min')return Math.max(...conKg.map(s=>s.kg*(1+s.reps/30)));
  return Math.max(...sets.map(s=>s.reps));
}
const meglio=(id,a,b)=>EX[id].k==='inv'?a<b:a>b;
// 1 migliorato, -1 peggiorato, 0 stabile (differenze sotto l'1% non contano).
const variazione=(id,c,p)=>Math.abs(c-p)<=Math.abs(p)*0.01?0:meglio(id,c,p)?1:-1;
function fmtValore(id,v){
  const k=EX[id].k;
  if(k==='inv')return fmtKg(v)+' kg di assistenza';
  if(k==='time')return Math.round(v)+'"';
  if(k==='min')return Math.round(v)+' min';
  return Math.round(v)+' kg';
}
function previste(s){const day=DAY[s.day];return day?dayEntries(day).reduce((n,{it})=>n+(s.sc&&s.sc[it[0]]?s.sc[it[0]][0]:it[1]),0):0}
function gruppi(ss){const g={};ss.forEach(s=>Object.keys(s.ex).forEach(id=>{const m=MUSCOLI[id];if(m)g[m]=(g[m]||0)+s.ex[id].length}));return g}
function confronto(id,cur,prev){
  const e=EX[id],cs=cur.ex[id];
  if(!prev)return {id,t:null,txt:'prima volta: '+cs.map(s=>fmtSet(e.k,s)).join(' · ')};
  const ps=prev.ex[id],c=punteggio(id,cs),p=punteggio(id,ps),t=variazione(id,c,p);
  const top=x=>Math.max(...x.map(s=>s.kg||0)),rip=x=>x.reduce((n,s)=>n+s.reps,0);
  let txt;
  if(e.k==='inv')txt=`assistenza ${fmtKg(p)} → ${fmtKg(c)} kg`;
  else if(e.k==='time')txt=`${p}" → ${c}"`;
  else if(e.k==='min')txt=`${p} → ${c} min`;
  else if(top(cs)>0&&top(cs)!==top(ps))txt=`${fmtKg(top(ps))} → ${fmtKg(top(cs))} kg`;
  else{const d=rip(cs)-rip(ps);txt=(top(cs)>0?`stesso carico (${fmtKg(top(cs))} kg), `:'')+(d?`${d>0?'+':''}${d} ripetizioni totali`:'stesse ripetizioni')}
  return {id,t,txt};
}
function daAumentare(){
  const piano=S.plan==='2'?'2':'3',out=[];
  DAYS.filter(d=>d.plan===piano).forEach(d=>dayEntries(d).forEach(({it})=>{
    if(out.some(o=>o.id===it[0]))return;const sg=suggest(it[0],it);if(sg.t==='up')out.push({id:it[0],msg:sg.msg})}));
  return out;
}
function settimana(off){
  const da=piuGiorni(lunedi(new Date()),7*off),a=piuGiorni(da,7),ss=tra(S.sessions,da,a);
  const ids=ordina([...new Set(ss.flatMap(s=>Object.keys(s.ex)))].filter(id=>EX[id]));
  return {da,a,off,ss,obiettivo:obiettivoDi(ss),mins:ss.reduce((n,s)=>n+(s.mins||0),0),
    fatte:ss.reduce((n,s)=>n+serieDi(s),0),previste:ss.reduce((n,s)=>n+previste(s),0),
    progressi:ids.map(id=>confronto(id,ss.find(s=>s.ex[id]),S.sessions.find(s=>s.ex[id]&&new Date(s.date)<da))),
    gruppi:gruppi(ss),peso:tra(pesi(),da,a)[0],pesoPrima:pesi().find(w=>new Date(w.date)<da),
    salire:off===0?daAumentare():[]};
}
function mese(off){
  const ora=new Date(),da=new Date(ora.getFullYear(),ora.getMonth()+off,1),a=new Date(da.getFullYear(),da.getMonth()+1,1);
  const ss=tra(S.sessions,da,a);
  // Le settimane del mese sono quelle che iniziano (lunedì) nel mese; contano solo quelle già cominciate.
  const settimane=[];
  for(let w=lunedi(da)<da?piuGiorni(lunedi(da),7):lunedi(da);w<a&&w<=ora;w=piuGiorni(w,7)){
    const sw=tra(S.sessions,w,piuGiorni(w,7));settimane.push({da:w,n:sw.length,obiettivo:obiettivoDi(sw)});
  }
  const ids=ordina([...new Set(ss.flatMap(s=>Object.keys(s.ex)))].filter(id=>EX[id]&&(EX[id].g==='comp'||EX[id].g==='uni')));
  const forza=ids.map(id=>{
    const l=ss.filter(s=>s.ex[id]);
    if(l.length<2)return {id,t:null,txt:'una sola seduta nel mese'};
    const p=punteggio(id,l[l.length-1].ex[id]),c=punteggio(id,l[0].ex[id]),pct=EX[id].k==='load'&&p>0?Math.round((c/p-1)*100):null;
    return {id,t:variazione(id,c,p),txt:`${fmtValore(id,p)} → ${fmtValore(id,c)}${pct!==null&&pct!==0?` (${pct>0?'+':''}${pct}%)`:''}`};
  });
  const g=gruppi(ss),nSett=(a-da)/864e5/7;Object.keys(g).forEach(k=>g[k]=Math.round(g[k]/nSett*10)/10);
  const att=[];
  ORDINE.forEach(id=>{
    const l=S.sessions.filter(s=>s.ex[id]&&new Date(s.date)<a);
    if(l.length<4||!ss.some(s=>s.ex[id]))return;
    const best=l.slice(0,3).map(s=>punteggio(id,s.ex[id])).reduce((x,y)=>meglio(id,y,x)?y:x);
    if(!meglio(id,best,punteggio(id,l[3].ex[id])))att.push(`${EX[id].name}: nessun miglioramento nelle ultime 3 sedute. Controlla tecnica e recupero; se continua, prova un'altra variante o una serie in più.`);
  });
  settimane.filter(w=>!w.n).forEach(w=>att.push(`Settimana del ${fmtG(w.da)}: nessuna seduta.`));
  let consec=0;for(let w=lunedi(a<=ora?piuGiorni(a,-1):ora);tra(S.sessions,w,piuGiorni(w,7)).length;w=piuGiorni(w,-7))consec++;
  if(consec>=6)att.push(`${consec} settimane di fila di allenamento. Se nelle ultime 6-8 non hai fatto uno scarico, la Guida consiglia una settimana leggera (circa 60% del carico, meno serie).`);
  return {da,a,off,ss,settimane,complete:settimane.filter(w=>w.n>=w.obiettivo).length,mins:ss.reduce((n,s)=>n+(s.mins||0),0),
    forza,gruppi:g,pesi:tra(pesi(),da,a).reverse(),att};
}

const trendHtml=t=>t===null?'<span class="tr">•</span>':`<span class="tr ${t>0?'up':t<0?'down':''}">${t>0?'▲':t<0?'▼':'='}</span>`;
const trendTxt=t=>t===null?'•':t>0?'▲':t<0?'▼':'=';
function gruppiHtml(g,titolo,nota){
  const mx=Math.max(1,...GRUPPI_M.map(k=>g[k]||0));
  return `<div class="card"><h2>${titolo}</h2>${nota?`<p class="muted rnote">${nota}</p>`:''}${GRUPPI_M.map(k=>`<div class="gbar"><span>${k}</span><div class="track"><i style="width:${(g[k]||0)/mx*100}%"></i></div><b>${fmtNum(g[k]||0)}</b></div>`).join('')}</div>`;
}
function pesoHtml(d){
  const w=d.peso,p=d.pesoPrima,diff=w&&p?w.kg-p.kg:null;
  const val=w?`<b>${fmtPeso(w.kg)} kg</b>${diff!==null?` <span class="muted">(${diff>0?'+':''}${fmtPeso(diff)} kg dalla pesata precedente)</span>`:''}`:'';
  if(d.off!==0)return `<div class="card"><h2>Peso</h2>${w?val:'<span class="muted">Nessuna pesata in questa settimana.</span>'}</div>`;
  return `<div class="card${w?'':' reminder'}"><h2>Pesata della settimana</h2>
    <p class="${w?'':'muted '}rnote">${w?val:'Pesati come al solito e scrivi qui il valore della bilancia.'}</p>
    <div class="peso"><div class="fld"><input id="peso" inputmode="decimal" placeholder="es. 78,4" value="${w?fmtPeso(w.kg):''}" aria-label="Peso in kg"><em>kg</em></div>
    <button class="btn small primary" data-act="wsave">${w?'Aggiorna':'Salva'}</button></div><div id="pmsg" class="muted" style="font-size:13px;margin-top:6px" aria-live="polite"></div></div>`;
}
function settimanaHtml(d){
  const salire=d.salire.length?`<div class="card"><h2>La prossima settimana</h2><p class="muted rnote">Esercizi pronti a salire di carico</p><ul class="rlist block">${d.salire.map(x=>`<li><b>${EX[x.id].name}</b><span>${x.msg}</span></li>`).join('')}</ul></div>`:'';
  if(!d.ss.length)return pesoHtml(d)+'<div class="card empty">Nessuna seduta in questa settimana.</div>'+salire;
  const comp=d.previste?Math.min(100,Math.round(d.fatte/d.previste*100)):null;
  return pesoHtml(d)+`<div class="card"><div class="kpi"><div><b>${d.ss.length}/${d.obiettivo}</b><span>sedute</span></div><div><b>${fmtDurata(d.mins)}</b><span>in palestra</span></div><div><b>${d.fatte}</b><span>serie${comp!==null?` · ${comp}% del previsto`:''}</span></div></div></div>
    <div class="card"><h2>Progressi</h2><p class="muted rnote">Rispetto alla seduta precedente con lo stesso esercizio</p>
    <ul class="rlist">${d.progressi.map(p=>`<li><span class="nm">${trendHtml(p.t)} ${EX[p.id].name}</span><span class="val">${p.txt}</span></li>`).join('')}</ul></div>`
    +gruppiHtml(d.gruppi,'Serie per gruppo muscolare')+salire;
}
function meseHtml(d){
  if(!d.ss.length&&!d.pesi.length)return '<div class="card empty">Nessuna seduta in questo mese.</div>';
  const mx=Math.max(3,...d.settimane.map(w=>w.n));
  let h=`<div class="card"><h2>Costanza</h2><div class="kpi"><div><b>${d.ss.length}</b><span>sedute</span></div><div><b>${d.complete}/${d.settimane.length}</b><span>settimane complete</span></div><div><b>${d.ss.length?Math.round(d.mins/d.ss.length):0} min</b><span>durata media</span></div></div>
    <div class="wbars">${d.settimane.map(w=>`<div class="${w.n>=w.obiettivo?'ok':''}"><b>${w.n}</b><i style="height:${Math.max(3,w.n/mx*56)}px"></i><span>${fmtG(w.da)}</span></div>`).join('')}</div></div>`;
  if(d.forza.length)h+=`<div class="card"><h2>Forza</h2><p class="muted rnote">Prima e ultima seduta del mese. Per i carichi è il massimale stimato, così si confrontano anche range di ripetizioni diversi.</p>
    <ul class="rlist">${d.forza.map(f=>`<li><span class="nm">${trendHtml(f.t)} ${EX[f.id].name}</span><span class="val">${f.txt}</span></li>`).join('')}</ul></div>`;
  if(d.ss.length)h+=gruppiHtml(d.gruppi,'Serie per gruppo muscolare','Media per settimana');
  if(d.pesi.length){const v=d.pesi.map(w=>w.kg),diff=v[v.length-1]-v[0];
    h+=`<div class="card"><h2>Peso</h2><div class="prow"><div class="nm">${v.length>1?`${fmtPeso(v[0])} → ${fmtPeso(v[v.length-1])} kg (${diff>0?'+':''}${fmtPeso(diff)})`:'Una pesata nel mese'}</div>${spark(v)}<div class="v">${fmtPeso(v[v.length-1])} kg</div></div></div>`}
  if(d.att.length)h+=`<div class="card"><h2>Attenzione</h2><div class="stack">${d.att.map(x=>`<div class="att">${x}</div>`).join('')}</div></div>`;
  return h;
}
function titoloReport(d){return rMode==='w'?`${fmtG(d.da)} – ${fmtG(piuGiorni(d.a,-1))}`:(t=>t[0].toUpperCase()+t.slice(1))(d.da.toLocaleDateString('it-IT',{month:'long',year:'numeric'}))}
function reportHtml(){
  const d=rMode==='w'?settimana(rOff):mese(rOff);
  return `<div class="stack"><div class="tabs" role="tablist" style="margin:0"><button role="tab" data-act="rmode" data-m="w" aria-selected="${rMode==='w'}">Settimana</button><button role="tab" data-act="rmode" data-m="m" aria-selected="${rMode==='m'}">Mese</button></div>
    <div class="rnav"><button class="btn small" data-act="rnav" data-d="-1" aria-label="Periodo precedente">‹</button><h2>${titoloReport(d)}</h2><button class="btn small" data-act="rnav" data-d="1" aria-label="Periodo successivo"${rOff>=0?' disabled':''}>›</button></div>
    ${rMode==='w'?settimanaHtml(d):meseHtml(d)}
    <div class="btnrow"><button class="btn small" data-act="rcopy">Copia report come testo</button></div><div id="rmsg" class="muted" style="font-size:14px" aria-live="polite"></div></div>`;
}
function reportTesto(){
  const d=rMode==='w'?settimana(rOff):mese(rOff),r=[(rMode==='w'?'Settimana ':'')+titoloReport(d)];
  if(rMode==='w'){
    if(d.peso)r.push(`Peso: ${fmtPeso(d.peso.kg)} kg`);
    r.push(`Sedute ${d.ss.length}/${d.obiettivo} · ${fmtDurata(d.mins)} · ${d.fatte} serie`);
    if(d.progressi.length)r.push('','Progressi:',...d.progressi.map(p=>`${trendTxt(p.t)} ${EX[p.id].name}: ${p.txt}`));
    if(d.ss.length)r.push('','Serie per gruppo: '+GRUPPI_M.filter(k=>d.gruppi[k]).map(k=>`${k} ${d.gruppi[k]}`).join(', '));
    if(d.salire.length)r.push('','Prossima settimana:',...d.salire.map(x=>`- ${EX[x.id].name}: ${x.msg}`));
  }else{
    r.push(`Sedute ${d.ss.length} · settimane complete ${d.complete}/${d.settimane.length} · durata media ${d.ss.length?Math.round(d.mins/d.ss.length):0} min`);
    if(d.forza.length)r.push('','Forza, prima → ultima seduta (per i carichi: massimale stimato):',...d.forza.map(f=>`${trendTxt(f.t)} ${EX[f.id].name}: ${f.txt}`));
    if(d.ss.length)r.push('','Serie per gruppo a settimana: '+GRUPPI_M.filter(k=>d.gruppi[k]).map(k=>`${k} ${fmtNum(d.gruppi[k])}`).join(', '));
    if(d.pesi.length)r.push('',`Peso: ${d.pesi.map(w=>fmtPeso(w.kg)).join(' → ')} kg`);
    if(d.att.length)r.push('','Attenzione:',...d.att.map(x=>'- '+x));
  }
  return r.join('\n');
}
function salvaPeso(){
  const v=parseFloat(String($('#peso').value).replace(',','.'));
  if(!(v>=30&&v<=300)){$('#pmsg').textContent='Scrivi un peso valido in kg, ad esempio 78,4.';return}
  const da=lunedi(new Date()),fine=piuGiorni(da,7);
  S.weights=pesi().filter(w=>{const d=new Date(w.date);return d<da||d>=fine});
  S.weights.push({date:new Date().toISOString(),kg:Math.round(v*10)/10});
  S.weights.sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0);
  touch();render();
}

function render(){
  const v=$('#view');
  if(tab==='storico')v.innerHTML=historyHtml();
  else if(tab==='report')v.innerHTML=reportHtml();
  else if(tab==='guida')v.innerHTML=guideHtml();
  else v.innerHTML=S.current&&!showHome?sessionHtml():homeHtml();
  if(tab==='oggi'&&S.current&&!showHome)updateProgress();
}
let showHome=false;
function syncTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab))}
function updateProgress(){
  if(!S.current)return;
  let tot=0,done=0;Object.values(S.current.sets).forEach(a=>a.forEach(s=>{tot++;if(s.done)done++}));
  const p=$('#prog');if(p){p.textContent=done+'/'+tot+' serie';$('#barfill').style.width=(tot?done/tot*100:0)+'%'}
  tickElapsed();
}
function tickElapsed(){const el=$('#elapsed');if(el&&S.current){const m=Math.floor((Date.now()-S.current.t0)/60000);el.textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' h'}}
setInterval(tickElapsed,20000);

/* ---------- Eventi ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;if(tab==='oggi')showHome=false;syncTabs();render();window.scrollTo(0,0)});
$('#view').addEventListener('input',e=>{
  const inp=e.target.closest('input[data-f]');if(!inp||!S.current)return;
  const row=inp.closest('.set');S.current.sets[row.dataset.ex][+row.dataset.i][inp.dataset.f]=inp.value;touch();
});
$('#view').addEventListener('change',e=>{
  const f=e.target.closest('input[data-act="impfile"]');if(f&&f.files&&f.files[0]){f.files[0].text().then(doImport,()=>bkMsg('File non leggibile.'));f.value='';return}
  const w=e.target.closest('input[data-act="warm"]');if(w&&S.current){S.current.warm[w.dataset.i]=w.checked;w.closest('label').classList.toggle('done',w.checked);touch()}
});
$('#view').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const a=b.dataset.act;
  if(a==='home'){showHome=true;render();window.scrollTo(0,0)}
  else if(a==='plan'){S.plan=b.dataset.plan;touch();render()}
  else if(a==='goreport'){tab='report';rMode='w';rOff=0;syncTabs();render();window.scrollTo(0,0)}
  else if(a==='rmode'){rMode=b.dataset.m;rOff=0;render()}
  else if(a==='rnav'){rOff=Math.min(0,rOff+(+b.dataset.d));render()}
  else if(a==='wsave'){salvaPeso()}
  else if(a==='rcopy'){const t=reportTesto(),m=$('#rmsg');
    try{navigator.clipboard.writeText(t).then(()=>{m.textContent='Report copiato: puoi incollarlo dove vuoi.'},()=>{m.textContent='Copia non riuscita su questo browser.'})}catch(err){m.textContent='Copia non riuscita su questo browser.'}}
  else if(a==='start'){startDay(b.dataset.day);showHome=false;render();window.scrollTo(0,0)}
  else if(a==='resume'){showHome=false;render();window.scrollTo(0,0);askWake()}
  else if(a==='chk'){
    const row=b.closest('.set'),id=row.dataset.ex,i=+row.dataset.i,s=S.current.sets[id][i];
    if(!s.done&&!(+s.reps>0)){row.querySelector('input[data-f="reps"]').focus();return}
    s.done=!s.done;row.classList.toggle('done',s.done);b.setAttribute('aria-pressed',s.done);
    if(s.done){const nx=S.current.sets[id][i+1];if(nx&&nx.kg===''&&s.kg!==''){nx.kg=s.kg;const k=document.getElementById('kg-'+id+'-'+(i+1));if(k)k.value=s.kg}}
    updateProgress();touch();
  }
  else if(a==='add'){const id=b.closest('section').dataset.ex,arr=S.current.sets[id],l=arr[arr.length-1];arr.push({kg:l?l.kg:'',reps:'',done:false});touch();render()}
  else if(a==='finish'){finish()}
  else if(a==='cancel'){
    if(b.dataset.arm){S.current=null;touch();render()}
    else{b.dataset.arm='1';b.textContent='Conferma: la sessione verrà eliminata'}
  }
  else if(a==='exp'){const t=bkData(),ta=$('#bk');ta.value=t;ta.focus();ta.select();
    try{navigator.clipboard.writeText(t).then(()=>bkMsg('Backup copiato negli appunti ('+S.sessions.length+' sedute). Incollalo nella nuova app.'),()=>bkMsg('Copia il testo nel riquadro: tieni premuto, Seleziona tutto, Copia.'))}catch(err){bkMsg('Copia il testo nel riquadro: tieni premuto, Seleziona tutto, Copia.')}}
  else if(a==='dl'){try{const u=URL.createObjectURL(new Blob([bkData()],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='scheda-allenamento-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);bkMsg('Se il download non parte, usa Esporta (copia).')}catch(err){bkMsg('Download non disponibile qui: usa Esporta (copia).')}}
  else if(a==='imp'){doImport($('#bk').value)}
  else if(a==='ghsave'){const c=ghCfg(),r=$('#ghrepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$|\/$/g,''),t=$('#ghtoken').value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(r)){syncMsg('Scrivi il repository come utente/nome.');return}
    if(!t&&!c.token){syncMsg('Inserisci il token.');return}
    ghSet({repo:r,token:t||c.token});syncGh(true).then(()=>{if(!ghCfg().err)render()})}
  else if(a==='ghnow'){syncGh(true)}
  else if(a==='ghoff'){try{localStorage.removeItem(GH_KEY)}catch(e){}render()}
  else if(a==='del'){
    if(openDel===b.dataset.id){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);openDel=null;touch();render()}
    else{openDel=b.dataset.id;b.textContent='Conferma eliminazione'}
  }
});

/* ---------- Avvio ---------- */
(function(){const l=lsGet();if(l&&l.sessions)S=l;if(S.current)delete S.current.tEnd})();
setTimeout(()=>syncGh(false),2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.current)syncGh(false)});
window.addEventListener('online',()=>syncGh(false));
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
